# Service Comptoir à placer dans la stack homelab.yml (Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example).
services:
  comptoir:
    image: ghcr.io/baloodusudouest/comptoir:${COMPTOIR_VERSION:-latest}
    container_name: comptoir
    restart: unless-stopped
    ports:
      - "${PORT_COMPTOIR:-8092}:8092"            # réseau local et Tailscale uniquement
    environment:
      - TZ=Europe/Paris
      - COMPTOIR_PASSWORD=${APPS_PASSWORD}       # mot de passe commun à toutes les applis (12 caractères au moins)
      - COMPTOIR_MISTRAL_CLE=${COMPTOIR_MISTRAL_CLE:-}         # facultatif : relire une recette mal découpée, sur un clic
      - COMPTOIR_RECHERCHE_WEB=${COMPTOIR_RECHERCHE_WEB:-oui}  # « non » : aucune recherche d'origine dans Wikidata
    volumes:
      - ${COMPTOIR_DATA_DIR}:/data               # comptoir.db, livres/ (les EPUB déposés), photos/
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
