# Arbre des ingrédients livré avec Comptoir : catégorie → famille → variante.
# « alias » : les façons dont les livres les écrivent (minuscules, sans article ; les accents sont ignorés à la comparaison).
# Une recette qui demande une famille accepte toute variante ; une recette qui demande une variante exige celle-ci.
# Drapeaux : sans_alcool (vaut pour la catégorie et ce qu'elle contient), toujours_la (compté comme présent),
#            frais (proposé « à racheter souvent »), garniture (ligne facultative par défaut).
# Les ingrédients ajoutés dans l'appli vivent dans la base, pas ici.

